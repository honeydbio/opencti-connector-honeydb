name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly: connectors-sdk is installed from upstream `master` (for parity
    # with OpenCTI-Platform/connectors), so drift there must be noticed.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/test-requirements.txt -r tools/requirements.txt
      - name: Format check
        run: ruff format --check .
      - name: Lint check
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Metadata is up to date
        run: |
          python tools/generate_metadata.py
          git diff --exit-code __metadata__/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: opencti-connector-honeydb:ci
